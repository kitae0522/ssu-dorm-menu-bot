name: Crawl weekly menu

on:
  schedule:
    # Monday 05:55 KST. The job waits until exactly 06:00 KST.
    - cron: "55 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Wait until 06:00 KST
        if: github.event_name == 'schedule'
        run: scripts/wait-until-kst.sh 06:00

      - name: Crawl weekly menu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MENU_JSON_PATH: data/menus.json
        run: go run ./cmd/crawl-weekly -notify

      - name: Commit updated menu JSON
        run: |
          if git diff --quiet -- data/menus.json; then
            echo "No menu changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menus.json
          git commit -m "chore: update weekly dorm menu"
          git push
