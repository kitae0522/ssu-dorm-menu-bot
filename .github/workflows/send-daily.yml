name: Send daily menu

on:
  schedule:
    # Daily 06:55 KST. The job waits until exactly 07:00 KST.
    - cron: "55 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional KST date to send, YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: [self-hosted, lab, linux, x64, container, lab-small]
    container:
      image: ghcr.io/kitae0522/ci-ubuntu-base:24.04
      options: >-
        --cpus 1.5
        --memory 2560m
        --pids-limit 768
        --cgroup-parent docker-workloads-ci.slice
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify Docker socket isolation
        run: test ! -S /var/run/docker.sock

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Wait until 07:00 KST
        if: github.event_name == 'schedule'
        run: scripts/wait-until-kst.sh 07:00

      - name: Send menu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MENU_JSON_PATH: data/menus.json
          DISPATCH_DATE: ${{ inputs.date }}
        run: |
          args=()
          if [[ -n "${DISPATCH_DATE}" ]]; then
            args+=("-date" "${DISPATCH_DATE}")
          fi
          go run ./cmd/send-daily "${args[@]}"
