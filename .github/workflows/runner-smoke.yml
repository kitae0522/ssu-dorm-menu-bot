name: Runner smoke test

on:
  workflow_dispatch:
    inputs:
      hold_seconds:
        description: "Seconds to hold each runner slot for capacity verification"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, lab, linux, x64, container, lab-small]
    container:
      image: ghcr.io/kitae0522/ci-ubuntu-base:24.04
      options: >-
        --cpus 1.5
        --memory 2560m
        --pids-limit 768
        --cgroup-parent docker-workloads-ci.slice
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Verify Ubuntu job container
        run: |
          source /etc/os-release
          test "$ID" = "ubuntu"
          printf 'container=%s %s\n' "$NAME" "$VERSION_ID"

      - name: Test
        run: go test ./...

      - name: Hold slot for capacity verification
        if: inputs.hold_seconds != '0'
        env:
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: sleep "$HOLD_SECONDS"
