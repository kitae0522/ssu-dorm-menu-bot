name: Crawl weekly menu

on:
  schedule:
    # Monday 06:00 KST. Keep an early attempt so the 07:00 daily send can
    # use this week's menu when the cafeteria has already posted it.
    - cron: "55 20 * * 0"
    # Later Monday retries. The 06:00 crawl often sees an empty table
    # because the weekly menu is posted later in the morning.
    - cron: "55 0 * * 1"
    - cron: "55 2 * * 1"
    - cron: "55 5 * * 1"
  workflow_dispatch:

concurrency:
  group: crawl-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Wait until scheduled KST time
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            "55 20 * * 0") scripts/wait-until-kst.sh 06:00 ;;
            "55 0 * * 1") scripts/wait-until-kst.sh 10:00 ;;
            "55 2 * * 1") scripts/wait-until-kst.sh 12:00 ;;
            "55 5 * * 1") scripts/wait-until-kst.sh 15:00 ;;
            *)
              echo "unknown schedule: ${{ github.event.schedule }}"
              exit 1
              ;;
          esac

      - name: Crawl weekly menu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MENU_JSON_PATH: data/menus.json
        run: go run ./cmd/crawl-weekly -notify

      - name: Commit updated menu JSON
        run: |
          if git diff --quiet -- data/menus.json; then
            echo "No menu changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menus.json
          git commit -m "chore: update weekly dorm menu"
          git push
